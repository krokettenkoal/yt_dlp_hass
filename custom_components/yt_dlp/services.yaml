download:
  name: Download video
  description: Download a video with yt-dlp into the configured folder. Runs in the background. Options left out use the values set in the integration's Configure dialog.
  fields:
    url:
      name: URL
      description: The URL of the video or playlist to download
      example: https://www.youtube.com/watch?v=1234567890
      required: true
      selector:
        text:
    restrictfilenames:
      name: Restrict filenames
      description: Replace spaces with underscores and remove quotes, dashes and other special characters from the file name
      selector:
        boolean:
    format:
      name: Format
      description: yt-dlp format selector, or pick a preset
      example: bv*+ba/b
      selector:
        select:
          custom_value: true
          options:
            - value: bv*+ba/b
              label: Best quality
            - value: bv*[height<=1080]+ba/b[height<=1080]
              label: Up to 1080p
            - value: bv*[height<=720]+ba/b[height<=720]
              label: Up to 720p
            - value: ba/b
              label: Audio only
    merge_output_format:
      name: Merge output format
      description: Container used when merging video and audio streams
      example: mkv
      selector:
        select:
          custom_value: true
          options:
            - mkv
            - mp4
            - webm
    noplaylist:
      name: Only this video
      description: If the URL points to a video inside a playlist, download only that video
      selector:
        boolean:
    playlist_items:
      name: Playlist items
      description: Items to download from a playlist
      example: 1-5,8
      selector:
        text:
    writesubtitles:
      name: Download subtitles
      description: Save subtitles as separate files
      selector:
        boolean:
    subtitleslangs:
      name: Subtitle languages
      description: Language codes of the subtitles to download
      example: en
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - en
            - de
            - fr
            - es
            - ja
    writethumbnail:
      name: Save thumbnail
      description: Save the thumbnail as a separate image file
      selector:
        boolean:
    writeinfojson:
      name: Save video info
      description: Save the video metadata as a separate .info.json file
      selector:
        boolean:
    concurrent_fragment_downloads:
      name: Concurrent fragments
      description: Number of fragments to download at the same time
      selector:
        number:
          min: 1
          max: 16
          step: 1
          mode: box
    retries:
      name: Retries
      description: Number of times to retry a failed download
      selector:
        number:
          min: 0
          max: 50
          step: 1
          mode: box
