download:
  name: Download video
  description: Download a video with yt-dlp into the configured folder. Runs in the background.
  fields:
    url:
      name: URL
      description: The URL of the video or playlist to download
      example: https://www.youtube.com/watch?v=1234567890
      required: true
      selector:
        text:
    format:
      name: Format
      description: yt-dlp format selector
      example: bv*+ba/b
      selector:
        text:
    merge_output_format:
      name: Merge output format
      description: Container used when merging video and audio streams, for example mp4 or mkv
      example: mkv
      selector:
        text:
    noplaylist:
      name: Only this video
      description: If the URL points to a video inside a playlist, download only that video
      selector:
        boolean:
    playlist_items:
      name: Playlist items
      description: Items to download from a playlist
      example: 1-5,8
      selector:
        text:
